name: Build Lia Office (Windows)

# Produces a signed-if-possible NSIS installer for Lia Office.
# Runs on a Windows runner because cross-building NSIS from macOS is unreliable
# and Authenticode signing effectively requires Windows.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or tag to build'
        required: false
        default: 'master'
      publish:
        description: 'Upload to the draft GitHub release v<version> (automatic updates)'
        type: boolean
        required: false
        default: false

# Publishing uploads to a release on this repo.
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # config.json is gitignored (it holds the Supabase URL + anon key), so it
      # has to be materialized here. Store the whole file body as the LIA_CONFIG_JSON
      # repository secret — Settings → Secrets and variables → Actions.
      - name: Write config.json
        shell: bash
        env:
          LIA_CONFIG_JSON: ${{ secrets.LIA_CONFIG_JSON }}
        run: |
          if [ -z "$LIA_CONFIG_JSON" ]; then
            echo "::error::LIA_CONFIG_JSON secret is not set — the build would ship without Supabase config."
            exit 1
          fi
          printf '%s' "$LIA_CONFIG_JSON" > config.json
          node -e "JSON.parse(require('fs').readFileSync('config.json','utf8'))" \
            || { echo "::error::LIA_CONFIG_JSON is not valid JSON"; exit 1; }
          echo "config.json written ($(wc -c < config.json) bytes)"

      - name: Type-check
        run: npm run typecheck

      # Not `npm test`. On Windows npm runs scripts through cmd.exe, which does
      # not expand globs — tsx would receive the literal string "src/*.test.ts",
      # find no such file, and fail the build. Running under bash so the shell
      # expands the pattern before tsx sees it.
      #
      # The files are found, not listed. A manual run uses master's copy of this
      # workflow to build whatever `ref` it is given, so a hardcoded list either
      # skips a branch's newer test folders or names one that ref doesn't have —
      # and an unmatched glob reaches tsx as a literal path and fails the build.
      - name: Test
        shell: bash
        run: |
          mapfile -t tests < <(find src -name '*.test.ts' | sort)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "::error::No test files found under src/"
            exit 1
          fi
          printf 'Running %d test files:\n' "${#tests[@]}"; printf '  %s\n' "${tests[@]}"
          npx tsx --test "${tests[@]}"

      # Code signing is optional so the workflow is useful before the certificate
      # lands. Once you have a .pfx, add these two secrets and every build is signed:
      #   WINDOWS_CERT_BASE64  — base64 of the .pfx file
      #   WINDOWS_CERT_PASSWORD
      # electron-builder reads CSC_LINK / CSC_KEY_PASSWORD automatically.
      - name: Build installer
        shell: bash
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERT_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::No signing certificate configured — installer will be UNSIGNED and will trigger a SmartScreen warning."
          fi
          # A pushed v* tag, or a manual run with publish ticked, uploads the
          # installer and latest.yml to the DRAFT release for that version.
          # Offices only see it once the draft is published by hand. Anything
          # else must never publish: with a publish config and GH_TOKEN set,
          # electron-builder would otherwise decide for itself.
          if [ "${{ github.ref_type }}" = "tag" ] || [ "${{ github.event.inputs.publish }}" = "true" ]; then
            npm run build:all
            npx electron-builder --win nsis --publish always
          else
            npm run build:all
            npx electron-builder --win nsis --publish never
          fi

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lia-office-windows
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest*.yml
          if-no-files-found: error
          retention-days: 30
