<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Set your password · Lia</title>
<!--
  Where an invitation and a password reset land.

  Supabase's verify endpoint checks the token and then redirects HERE with the
  session in the URL fragment. Until this page existed, that redirect went to
  http://localhost:3000 — the default Site URL of a project nobody had told
  otherwise — so every invitation ended at "this site can't be reached" after
  the link had already been spent.

  It is deliberately on the certificate site's bucket: the domain is already
  live, already has its certificate, and is the one address in this system that
  people outside the company are expected to open.
-->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root { --bg:#f4f4f7; --card:#fff; --fg:#14142b; --muted:#5a5a72; --line:#e6e6ef;
          --accent:#4f6ef7; --bad:#c0392b; --ok:#1e8e4e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f0f1a; --card:#181828; --fg:#f0f0f5; --muted:#a0a0b8; --line:#2a2a3e; }
  }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); padding:24px 16px;
         font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:30px 26px; width:100%; max-width:420px; }
  h1 { font-size:21px; margin:0 0 6px; }
  .sub { color:var(--muted); font-size:14px; line-height:1.6; margin-bottom:20px; }
  label { display:block; font-size:11px; color:var(--muted); text-transform:uppercase;
          letter-spacing:.06em; margin:14px 0 5px; }
  input { width:100%; padding:12px; font-size:16px; border-radius:8px; color:var(--fg);
          border:1px solid var(--line); background:var(--bg); }
  button { width:100%; margin-top:20px; padding:13px; font-size:15px; font-weight:600;
           color:#fff; background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.55; cursor:default; }
  .msg { margin-top:14px; font-size:13.5px; line-height:1.6; min-height:20px; }
  .msg.err { color:var(--bad); }
  .msg.ok  { color:var(--ok); }
  .next { margin-top:18px; padding-top:16px; border-top:1px solid var(--line);
          color:var(--muted); font-size:13.5px; line-height:1.7; display:none; }
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Set your password</h1>
  <div class="sub" id="sub">Checking your link…</div>

  <form id="form" style="display:none;" autocomplete="on">
    <input type="email" id="email" autocomplete="username" style="display:none;">
    <label for="pw">New password</label>
    <input type="password" id="pw" autocomplete="new-password" minlength="8"
           placeholder="At least 8 characters">
    <label for="pw2">Again</label>
    <input type="password" id="pw2" autocomplete="new-password" minlength="8">
    <button type="submit" id="go">Save password</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="next" id="next">
    <b>Now, on your phone:</b><br>
    1. Open Lia Field.<br>
    2. Sign in with <span id="who">this email address</span> and the password you just set.<br>
    3. Do it somewhere with signal — the app downloads your company's equipment
       list once, then works with no signal at all.
  </div>
</div>

<script>
const SUPABASE_URL      = 'https://bqoxpbjtqwicurmuxueq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_WgGGcm9a-sJFt-9kpaWwAg_Rm-ft5Nj';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  // The session arrives in the URL fragment. Persisting it would leave somebody
  // signed in on a shared phone long after they set a password here.
  auth: { detectSessionInUrl: true, persistSession: false },
});

const $ = id => document.getElementById(id);
const show = (text, kind) => { $('msg').textContent = text; $('msg').className = 'msg ' + (kind || ''); };

// An error comes back in the fragment too — an expired or already-used link
// arrives here rather than at Supabase, so it has to be read and explained.
function fragmentError() {
  const f = new URLSearchParams(location.hash.replace(/^#/, ''));
  const code = f.get('error_code') || f.get('error');
  if (!code) return null;
  const desc = (f.get('error_description') || '').replace(/\+/g, ' ');
  if (/expired/i.test(code + desc)) {
    return 'This link has expired. Ask whoever invited you to send another — it only takes a moment.';
  }
  if (/used|invalid/i.test(code + desc)) {
    return 'This link has already been used. If you have not set a password yet, ask for a new invitation.';
  }
  return desc || 'This link is not valid any more.';
}

(async () => {
  const err = fragmentError();
  if (err) { $('sub').textContent = ''; show(err, 'err'); return; }

  // detectSessionInUrl runs asynchronously; the session is what proves the
  // token was good, so wait for it rather than guessing from the URL.
  let session = null;
  for (let i = 0; i < 25 && !session; i++) {
    const { data } = await db.auth.getSession();
    session = data.session;
    if (!session) await new Promise(r => setTimeout(r, 120));
  }

  if (!session) {
    $('sub').textContent = '';
    show('This link is not valid any more. Ask whoever invited you to send another.', 'err');
    return;
  }

  const email = session.user.email || '';
  $('email').value = email;
  $('who').textContent = email || 'your email address';
  $('sub').textContent = email
    ? `Choose a password for ${email}. You only do this once.`
    : 'Choose a password. You only do this once.';
  $('form').style.display = '';
  $('pw').focus();
})();

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('pw').value, pw2 = $('pw2').value;
  if (pw.length < 8)  return show('Use at least 8 characters.', 'err');
  if (pw !== pw2)     return show('The two passwords are not the same.', 'err');

  $('go').disabled = true;
  show('Saving…');
  const { error } = await db.auth.updateUser({ password: pw });
  $('go').disabled = false;

  if (error) return show(error.message || 'Could not save that password.', 'err');

  $('title').textContent = 'Password set';
  $('sub').textContent = '';
  $('form').style.display = 'none';
  $('next').style.display = 'block';
  show('You can close this page.', 'ok');
  // Nothing should stay signed in here: this page is a one-time errand, often
  // opened on a phone that is passed around.
  db.auth.signOut();
});
</script>
</body>
</html>
